apiVersion: apps/v1
kind: Deployment
metadata:
  name: pmomax-mcp
  labels:
    app.kubernetes.io/name: pmomax-mcp
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: pmomax-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pmomax-mcp
    spec:
      serviceAccountName: pmomax-mcp
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ${PMOMAX_MCP_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - secretRef:
                name: pmomax-mcp-config
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: pmomax-mcp
spec:
  selector:
    app.kubernetes.io/name: pmomax-mcp
  ports:
    - name: http
      port: 8081
      targetPort: http
