- apiVersion: v1
  data:
    nodelocaldns-metrics-collector-config-data: |
      # proto-file: cloud/kubernetes/metrics/components/collector/config/collector.proto
      # proto-message: Config

      scrape_target: {
        url: "http://127.0.0.1:9253/metrics"
        # target_name is used to populate container_name field in the metric.
        # It should be the same as the container name in the manifest.
        # In our case all metrics are attributed to k8s_node so this only affects the
        # key prefix used in the configmap. For compatibility with older versions
        # we keep the component name as target_name.
        target_name: "nodelocaldns"
      }
      export_target: {
        endpoint: "monitoring.googleapis.com:443"
      }
      metrics: {
        source_metric_name: "coredns_cache_drops_total"
        export_metric_name: "kubernetes.io/internal/nodes/coredns/cache_drops_total"
        resource_metadata: {
          metric_schema: SCHEMA_K8S_NODE
        }
        value_type: VALUE_TYPE_DOUBLE
        metric_kind: METRIC_KIND_CUMULATIVE
        metric_labels: {
          source_name: "server"
          type: METRIC_LABEL_STRING
          description: "DNS Server IP"
        }
        description: "The number responses that are not cached, because the reply is malformed."
        unit: "1"
      }
      metrics: {
        source_metric_name: "coredns_cache_hits_total"
        export_metric_name: "kubernetes.io/internal/nodes/coredns/cache_hits_total"
        resource_metadata: {
          metric_schema: SCHEMA_K8S_NODE
        }
        value_type: VALUE_TYPE_INT64
        metric_kind: METRIC_KIND_CUMULATIVE
        metric_labels: {
          source_name: "server"
          type: METRIC_LABEL_STRING
          description: "DNS Server IP"
        }
        metric_labels: {
          source_name: "type"
          type: METRIC_LABEL_STRING
          description: "Indicates if this was a success or denial (NXDOMAIN)"
        }
        metric_labels: {
          source_name: "view"
          type: METRIC_LABEL_STRING
          description: "Shows view name"
        }
        metric_labels: {
          source_name: "zones"
          type: METRIC_LABEL_STRING
          description: "Zones/domains used in each server when there are multiple server blocks with the cache plugin enabled. https://github.com/coredns/coredns/pull/5124"
        }
        description: "The count of cache hits."
        unit: "1"
      }
      metrics: {
        source_metric_name: "coredns_cache_misses_total"
        export_metric_name: "kubernetes.io/internal/nodes/coredns/cache_misses_total"
        resource_metadata: {
          metric_schema: SCHEMA_K8S_NODE
        }
        value_type: VALUE_TYPE_INT64
        metric_kind: METRIC_KIND_CUMULATIVE
        metric_labels: {
          source_name: "server"
          type: METRIC_LABEL_STRING
          description: "DNS Server IP"
        }
        metric_labels: {
          source_name: "view"
          type: METRIC_LABEL_STRING
          description: "Shows view name"
        }
        metric_labels: {
          source_name: "zones"
          type: METRIC_LABEL_STRING
          description: "Zones/domains used in each server when there are multiple server blocks with the cache plugin enabled. https://github.com/coredns/coredns/pull/5124"
        }
        description: "The count of cache misses."
        unit: "1"
      }
      metrics: {
        source_metric_name: "coredns_cache_prefetch_total"
        export_metric_name: "kubernetes.io/internal/nodes/coredns/cache_prefetch_total"
        resource_metadata: {
          metric_schema: SCHEMA_K8S_NODE
        }
        value_type: VALUE_TYPE_DOUBLE
        metric_kind: METRIC_KIND_CUMULATIVE
        metric_labels: {
          source_name: "server"
          type: METRIC_LABEL_STRING
          description: "DNS Server IP"
        }
        description: "The number of time the cache has prefetched a cached item."
        unit: "1"
      }
      metrics: {
        source_metric_name: "coredns_cache_entries"
        export_metric_name: "kubernetes.io/internal/nodes/coredns/cache_entries"
        resource_metadata: {
          metric_schema: SCHEMA_K8S_NODE
        }
        value_type: VALUE_TYPE_INT64
        metric_kind: METRIC_KIND_GAUGE
        metric_labels: {
          source_name: "server"
          type: METRIC_LABEL_STRING
          description: "DNS Server IP"
        }
        metric_labels: {
          source_name: "type"
          type: METRIC_LABEL_STRING
          description: "Indicates if this was a success or denial (NXDOMAIN)"
        }
        metric_labels: {
          source_name: "view"
          type: METRIC_LABEL_STRING
          description: "Shows view name"
        }
        metric_labels: {
          source_name: "zones"
          type: METRIC_LABEL_STRING
          description: "Zones/domains used in each server when there are multiple server blocks with the cache plugin enabled. https://github.com/coredns/coredns/pull/5124"
        }
        description: "The number of elements in the cache."
        unit: "1"
      }
      metrics: {
        source_metric_name: "coredns_dns_requests_total"
        export_metric_name: "kubernetes.io/internal/nodes/coredns/dns_requests_total"
        resource_metadata: {
          metric_schema: SCHEMA_K8S_NODE
        }
        value_type: VALUE_TYPE_INT64
        metric_kind: METRIC_KIND_CUMULATIVE
        metric_labels: {
          source_name: "family"
          type: METRIC_LABEL_STRING
          description: "The address family of the transport (1 = IP (IP version 4), 2 = IP6 (IP version 6)"
        }
        metric_labels: {
          source_name: "proto"
          type: METRIC_LABEL_STRING
          description: "Transport protocol used for DNS query"
        }
        metric_labels: {
          source_name: "server"
          type: METRIC_LABEL_STRING
          description: "DNS Server IP"
        }
        metric_labels: {
          source_name: "type"
          type: METRIC_LABEL_STRING
          description: "Query type. It holds most common types (A, AAAA, MX, SOA, CNAME, PTR, TXT,NS, SRV, DS, DNSKEY, RRSIG, NSEC, NSEC3, IXFR, AXFR and ANY) and \\\"other\\\" which lumps together all other types"
        }
        metric_labels: {
          source_name: "view"
          type: METRIC_LABEL_STRING
          description: "Shows view name"
        }
        metric_labels: {
          source_name: "zone"
          type: METRIC_LABEL_STRING
          description: "DNS Zone"
        }
        description: "Counter of DNS requests made per zone, protocol, family and type."
        unit: "1"
      }
      metrics: {
        source_metric_name: "coredns_dns_request_duration_seconds"
        export_metric_name: "kubernetes.io/internal/nodes/coredns/dns_request_duration_seconds"
        resource_metadata: {
          metric_schema: SCHEMA_K8S_NODE
        }
        value_type: VALUE_TYPE_DISTRIBUTION
        metric_kind: METRIC_KIND_CUMULATIVE
        metric_labels: {
          source_name: "server"
          type: METRIC_LABEL_STRING
          description: "DNS Server IP"
        }
        metric_labels: {
          source_name: "type"
          type: METRIC_LABEL_STRING
          description: "Query type. It holds most common types (A, AAAA, MX, SOA, CNAME, PTR, TXT,NS, SRV, DS, DNSKEY, RRSIG, NSEC, NSEC3, IXFR, AXFR and ANY) and \\\"other\\\" which lumps together all other types"
        }
        metric_labels: {
          source_name: "view"
          type: METRIC_LABEL_STRING
          description: "Shows view name"
        }
        metric_labels: {
          source_name: "zone"
          type: METRIC_LABEL_STRING
          description: "DNS Zone"
        }
        description: "Histogram of the time (in seconds) each request took. This includes both cached and forwarded requests."
        unit: "s"
      }
      metrics: {
        source_metric_name: "coredns_dns_responses_total"
        export_metric_name: "kubernetes.io/internal/nodes/coredns/dns_responses_total"
        resource_metadata: {
          metric_schema: SCHEMA_K8S_NODE
        }
        value_type: VALUE_TYPE_INT64
        metric_kind: METRIC_KIND_CUMULATIVE
        metric_labels: {
          source_name: "plugin"
          type: METRIC_LABEL_STRING
          description: "Name of the plugin that made the write to the client. If the server did the write (on error for instance), the value is empty."
        }
        metric_labels: {
          source_name: "rcode"
          type: METRIC_LABEL_STRING
          description: "DNS return code"
        }
        metric_labels: {
          source_name: "server"
          type: METRIC_LABEL_STRING
          description: "DNS Server IP"
        }
        metric_labels: {
          source_name: "view"
          type: METRIC_LABEL_STRING
          description: "Shows view name"
        }
        metric_labels: {
