    core-metrics-exporter-config: "receivers:\n  kubenode:\n    endpoint: \"https://$KUBELET_HOST_URL:10250\"\n
      \   scrape_interval: 60s\n    cluster_name: pmomax-auto\n    location: us-central1\n
      \   node_name: \"$NODE_NAME\"\n    kubernetes_service_host: \"$KUBERNETES_SERVICE_HOST\"\n
      \   certificate_location: \"/var/run/secrets/kubernetes.io/serviceaccount/ca.crt\"\n
      \   use_watch: true\n  prometheus/nostarttime:\n    use_start_time_metric: false\n
      \   config:\n      scrape_configs:\n      - job_name: \"self-observability\"\n
      \       scrape_interval: 60s\n        static_configs:\n        - targets: [\"$HOST_LOOPBACK:8200\"]\n
      \       metric_relabel_configs:\n        - source_labels: [ __name__ ]\n          target_label:
      gke_component_name\n          replacement: \"addons/gke_metrics_agent\"\n        -
      source_labels: [__name__]\n          target_label: container\n          replacement:
      \"autoscaling-metrics-exporter\"\n        - source_labels: [__name__]\n          target_label:
      pod\n          replacement: \"$POD_NAME\"\n        - source_labels: [__name__]\n
      \         target_label: namespace\n          replacement: \"$POD_NAMESPACE\"\n
      \       \n        - source_labels: [__name__]\n          regex: \"grpc_io_client_(completed_rpcs|roundtrip_latency_.*)\"\n
      \         target_label: otelsvc_exporter\n          replacement: \"googlecloud\"\n
      \       \n        - source_labels: [exporter]\n          target_label: otelsvc_exporter\n
      \         replacement: ${ARG1}\n          regex: \"(.+)\"\n        - source_labels:
      [receiver]\n          target_label: otelsvc_receiver\n          replacement:
