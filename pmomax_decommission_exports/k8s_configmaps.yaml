  data:
    Corefile: "cluster.local:53 {\n    errors\n    \n    template ANY AAAA {\n      rcode
      NOERROR\n    }\n    \n    cache {\n            success 2560 30\n            denial
      2560 5\n    }\n    loop\n    \n    bind 169.254.20.10 34.118.224.10\n    \n
      \   forward . /etc/resolv.conf\n    prometheus :9253\n    \n    health 169.254.20.10:8080\n
      \   \n    }\nin-addr.arpa:53 {\n    errors\n    loop\n    \n    bind 169.254.20.10
      34.118.224.10\n    \n    forward . /etc/resolv.conf\n    prometheus :9253\n
      \   }\nip6.arpa:53 {\n    errors\n    loop\n    \n    bind 169.254.20.10 34.118.224.10\n
      \   \n    forward . /etc/resolv.conf\n    prometheus :9253\n    }\n.:53 {\n
      \   errors\n    \n    template ANY AAAA {\n      rcode NOERROR\n    }\n    \n
      \   cache {\n            success 2560 30\n            denial 2560 5\n    }\n
      \   loop\n    \n    bind 169.254.20.10 34.118.224.10\n    \n    forward . __PILLAR__UPSTREAM__SERVERS__\n
      \   prometheus :9253\n    \n    }\n"
