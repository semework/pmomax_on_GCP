      \  True\n\n    - name:             tail\n      Alias:            gvisor_panic\n
      \     Tag:              kube-pod_<namespace_name>_<pod_name>_<runtime>panic\n
      \     Tag_Regex:        \\/var\\/log\\/pods\\/(?<namespace_name>[^_]+)_(?<pod_name>[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)_(?<id>[\\-a-z0-9]+)\\/(?<runtime>[a-z]+)_panic\\.log\n
      \     Exclude_Path:     /var/log/pods/kube-system_*/*,/var/log/pods/istio-system_*/*,/var/log/pods/knative-serving_*/*,/var/log/pods/gke-system_*/*,/var/log/pods/config-management-system_*/*,/var/log/pods/gmp-system_*/*,/var/log/pods/gke-managed-cim_*/*,/var/log/pods/gke-managed-volumepopulator_*/*,/var/log/pods/gke-managed-checkpointing_*/*,/var/log/pods/gke-managed-lustrecsi_*/*,/var/log/pods/gke-managed-otel_*/*,/var/log/pods/gke-managed-mldiagnostics_*/*,/var/log/pods/gke-managed-networking-dra-driver_*/*,/var/log/pods/gke-managed-pod-snapshots_*/*\n
      \     Path:             /var/log/pods/*/*_panic.log\n      DB:               /var/lib/google-fluentbit/pos-files/gvisor_panic.db\n
      \     Key:              message\n      Buffer_Max_Size:  1MB\n      Mem_Buf_Limit:
      \   1MB\n      Skip_Long_Lines:  On\n      Refresh_Interval: 5\n      Read_from_Head:
      \  True\n    \n\n    # Example:\n    # Dec 21 23:17:22 gke-foo-1-1-4b5cbd14-node-4eoj
      startupscript: Finished running startup script /var/run/google.startup.script\n
      \   - name:   tail\n      Parser: syslog\n      Path:   /var/log/startupscript.log\n
      \     DB:     /var/lib/google-fluentbit/pos-files/startupscript.db\n      Alias:
      \ startupscript\n      Tag:    startupscript\n\n  # Logs from anetd for policy
      action\n    - name:             tail\n      Parser:           network-log\n
      \     Alias:            policy-action\n      Tag:              policy-action\n
      \     Path:             /var/log/network/policy_action.log\n      DB:               /var/lib/google-fluentbit/pos-files/policy-action.db\n
      \     Skip_Long_Lines:  On\n      Refresh_Interval: 5\n      Read_from_Head:
      \  True\n\n  # Example:\n  # I1118 21:26:53.975789       6 proxier.go:1096]
      Port \"nodePort for kube-system/default-http-backend:http\" (:31429/tcp) was
      open before and is still needed\n    - name:            tail\n      Alias:           kube-proxy\n
      \     Tag:             kube-proxy\n      Path:            /var/log/kube-proxy.log\n
      \     DB:              /var/lib/google-fluentbit/pos-files/kube-proxy.db\n      Buffer_Max_Size:
      1MB\n      Mem_Buf_Limit:   1MB\n      Parser:          glog\n      Read_from_Head:
      \ True\n\n    # Logs from systemd-journal for interesting services.\n    \n
      \   - name:            systemd\n      Alias:           docker\n      Tag:             docker\n
      \     Systemd_Filter:  _SYSTEMD_UNIT=docker.service\n      Path:            /var/log/journal\n
      \     DB:              /var/lib/google-fluentbit/pos-files/docker.db\n      Mem_Buf_Limit:
      \  1MB\n    \n    - name:            systemd\n      Alias:           kubelet\n
      \     Tag:             kubelet\n      Systemd_Filter:  _SYSTEMD_UNIT=kubelet.service\n
      \     Path:            /var/log/journal\n      DB:              /var/lib/google-fluentbit/pos-files/kubelet.db\n
      \     Mem_Buf_Limit:   1MB\n    \n    - name:            systemd\n      Alias:
      \          kube-node-installation\n      Tag:             kube-node-installation\n
      \     Systemd_Filter:  _SYSTEMD_UNIT=kube-node-installation.service\n      Path:
      \           /var/log/journal\n      DB:              /var/lib/google-fluentbit/pos-files/kube-node-installation.db\n
      \     Mem_Buf_Limit:   1MB\n    \n    - name:            systemd\n      Alias:
      \          kube-node-configuration\n      Tag:             kube-node-configuration\n
      \     Systemd_Filter:  _SYSTEMD_UNIT=kube-node-configuration.service\n      Path:
      \           /var/log/journal\n      DB:              /var/lib/google-fluentbit/pos-files/kube-node-configuration.db\n
      \     Mem_Buf_Limit:   1MB\n    \n    - name:            systemd\n      Alias:
      \          kube-logrotate\n      Tag:             kube-logrotate\n      Systemd_Filter:
      \ _SYSTEMD_UNIT=kube-logrotate.service\n      Path:            /var/log/journal\n
      \     DB:              /var/lib/google-fluentbit/pos-files/kube-logrotate.db\n
      \     Mem_Buf_Limit:   1MB\n    \n    - name:            systemd\n      Alias:
      \          node-problem-detector\n      Tag:             node-problem-detector\n
      \     Systemd_Filter:  _SYSTEMD_UNIT=node-problem-detector.service\n      Path:
      \           /var/log/journal\n      DB:              /var/lib/google-fluentbit/pos-files/node-problem-detector.db\n
      \     Mem_Buf_Limit:   1MB\n    \n    - name:            systemd\n      Alias:
      \          kube-container-runtime-monitor\n      Tag:             kube-container-runtime-monitor\n
      \     Systemd_Filter:  _SYSTEMD_UNIT=kube-container-runtime-monitor.service\n
      \     Path:            /var/log/journal\n      DB:              /var/lib/google-fluentbit/pos-files/kube-container-runtime-monitor.db\n
      \     Mem_Buf_Limit:   1MB\n    \n    - name:            systemd\n      Alias:
      \          kubelet-monitor\n      Tag:             kubelet-monitor\n      Systemd_Filter:
      \ _SYSTEMD_UNIT=kubelet-monitor.service\n      Path:            /var/log/journal\n
      \     DB:              /var/lib/google-fluentbit/pos-files/kubelet-monitor.db\n
      \     Mem_Buf_Limit:   1MB\n    \n    - name:            systemd\n      Alias:
      \          gcfsd\n      Tag:             gcfsd\n      Systemd_Filter:  _SYSTEMD_UNIT=gcfsd.service\n
      \     Path:            /var/log/journal\n      DB:              /var/lib/google-fluentbit/pos-files/gcfsd.db\n
      \     Mem_Buf_Limit:   1MB\n    \n    - name:            systemd\n      Alias:
      \          gcfs-snapshotter\n      Tag:             gcfs-snapshotter\n      Systemd_Filter:
      \ _SYSTEMD_UNIT=gcfs-snapshotter.service\n      Path:            /var/log/journal\n
      \     DB:              /var/lib/google-fluentbit/pos-files/gcfs-snapshotter.db\n
      \     Mem_Buf_Limit:   1MB\n    \n    - name:            systemd\n      Alias:
      \          criproxy\n      Tag:             criproxy\n      Systemd_Filter:
      \ _SYSTEMD_UNIT=criproxy.service\n      Path:            /var/log/journal\n
      \     DB:              /var/lib/google-fluentbit/pos-files/criproxy.db\n      Mem_Buf_Limit:
      \  1MB\n    \n\n    - name:            systemd\n      Alias:           container-runtime\n
      \     Tag:             container-runtime\n      Systemd_Filter:  _SYSTEMD_UNIT=containerd.service\n
      \     Path:            /var/log/journal\n      DB:              /var/lib/google-fluentbit/pos-files/container-runtime.db\n
      \     Mem_Buf_Limit:   1MB\n\n    \n\n  filters:\n    \n\n    - name:         lua\n
      \     Alias:        redact-kubelet-lua\n      Match:        kubelet\n      Script:
      \      redact_kubelet.lua\n      Call:         redact_sensitive_info\n\n    -
      name:         modify\n      Match:        kubelet\n      Alias:        kubelet_remove_cmdline\n
      \     Remove:       _CMDLINE\n\n  \n\n    - name:         modify\n      Match:
      \       '*'\n      Hard_rename:  log message\n\n    - name:         parser\n
      \     Match:        kube_*\n      Key_Name:     message\n      Reserve_Data:
      On\n      Parser:       glog\n      Parser:       tsl_tf_cpp\n      Parser:
      \      json\n\n    \n\n    # level is a common synonym for severity,\n    #
      the default field name in libraries such as GoLang's zap.\n    # populate severity
      with level, if severity does not exist.\n    - name:        modify\n      Match:
      \      kube_*\n      Copy:        level severity\n\n    \n\n    \n\n  outputs:\n
      \   \n\n    \n    - name:        http\n      Match:       '*'\n      Host:        127.0.0.1\n
      \     Port:        2021\n      URI:         /logs\n      header_tag:  FLUENT-TAG\n
      \     Format:      msgpack\n      Retry_Limit: 2\n    \n\n    "
    parsers.conf: "[PARSER]\n    Name              containerd\n    Format            regex\n
      \   # The timestamp is described in https://www.rfc-editor.org/rfc/rfc3339#section-5.6\n
      \   # Containerd logs follow the pattern of CRI Log Format (https://github.com/kubernetes/design-proposals-archive/blob/main/node/kubelet-cri-logging.md):
      <timestamp> <stream> <tag> <log_content>\n    # F in tag means \"Full Log\",
      and P means \"Partial Log\".\n    \n    Regex             ^(?<time>[0-9]{4}-[0-9]{2}-[0-9]{2}[Tt
      ][0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]+)?(?:[Zz]|[+-][0-9]{2}:[0-9]{2}))\\s+(?<stream>stdout|stderr)\\s(F|P)\\s(?<log>.*)$\n
      \   \n    Time_Key          time\n    Reserve_Data      On\n    Time_Format
      \      %Y-%m-%dT%H:%M:%S.%L%z\n    Skip_Empty_Values false\n\n[PARSER]\n    Name
      \       json\n    Format      json\n\n[PARSER]\n    Name        syslog\n    Format
      \     regex\n    Regex       ^\\<(?<pri>[0-9]+)\\>(?<time>[^ ]* {1,2}[^ ]* [^
      ]*) (?<host>[^ ]*) (?<ident>[a-zA-Z0-9_\\/\\.\\-]*)(?:\\[(?<pid>[0-9]+)\\])?(?:[^\\:]*\\:)?
      *(?<message>.*)$\n    Time_Key    time\n    Time_Format %b %d %H:%M:%S\n\n[PARSER]\n
      \   Name        glog\n    Format      regex\n    # We skip the glog timestamp
      as it doesn't have year (in most cases) and time zone information.\n    # Instead,
      we rely on the containerd timestamp, which is available for every log line.\n
      \   Regex       ^(?<severity>\\w)\\d{4}?\\d{4} [^\\s]*\\s+(?<pid>\\d+)\\s+(?<source_file>[^
      \\]]+)\\:(?<source_line>\\d+)\\]\\s(?<message>.*)$\n\n[PARSER]\n    Name        tsl_tf_cpp\n
      \   Format      regex\n    # TensorFlow/TSL customizes the Abseil C++ log format
      to include the full YYYY-MM-DD date and omits the thread ID.\n    Regex       ^\\d{4}-\\d{2}-\\d{2}
      \\d{2}:\\d{2}:\\d{2}\\.\\d{6}:\\s+(?<severity>[IWEF])\\s+(?<source_file>[^\\s:]+):(?<source_line>\\d+)\\]\\s+(?<message>.*)$\n\n[PARSER]\n
      \   Name        network-log\n    Format      json\n    Time_Key    timestamp\n
      \   Time_Format %Y-%m-%dT%H:%M:%S.%L%z\n\n# Example:\n# [2023/01/05 00:01:58]
      [ info] [output:http:http.0] 127.0.0.1:2021, HTTP status=200\\\n# Rubular: https://screenshot.googleplex.com/8SvHiZJLUkW9idQ\n[PARSER]\n
      \   Name   fluentbit\n    Format regex\n    \n    Regex  \\[(?<time>[^\\]]+)\\][
      ]*\\[[ ]*(?<severity>[^\\]]+)\\][ ]*\\[(?<plugin>[^\\]]+)\\] (?<log>.*)\n    \n
      \   Time_Key time\n    Time_Format %Y/%m/%d %H:%M:%S"
    redact_kubelet.lua: |-
      function redact_sensitive_info(tag, timestamp, record)
        message = record["MESSAGE"]
        if message then
          if string.find(message, "access_token=ya29.[a-zA-Z0-9._-]*") then
            local redact_message = string.gsub(message, "access_token=ya29.[a-zA-Z0-9._-]*", "access_token=<REDACTED>")
            record["MESSAGE"] = redact_message
            return 2, timestamp, record
          end
        end
        return 0, timestamp, record
      end
