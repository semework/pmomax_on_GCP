      }
      metrics: {
        source_metric_name: "kubedns_dnsmasq_misses"
        export_metric_name: "kubernetes.io/internal/addons/kubedns/dnsmasq_misses"
        resource_metadata: {
          metric_schema: SCHEMA_K8S_CONTAINER
        }
        value_type: VALUE_TYPE_INT64
        metric_kind: METRIC_KIND_CUMULATIVE
        description: "Number of DNS cache misses (from start of process)."
        unit: "{requests}"
      }
      metrics: {
        source_metric_name: "kubedns_dnsmasq_hits"
        export_metric_name: "kubernetes.io/internal/addons/kubedns/dnsmasq_hits"
        resource_metadata: {
          metric_schema: SCHEMA_K8S_CONTAINER
        }
        value_type: VALUE_TYPE_INT64
        metric_kind: METRIC_KIND_CUMULATIVE
        description: "Number of DNS cache hits (from start of process)."
        unit: "{requests}"
      }
