      otelsvc_processor\n          replacement: ${ARG1}\n          regex: \"(.*)\"\n
      \       - regex: \"service_name|service_instance_id|service_version|receiver|processor|exporter|transport\"\n
      \         action: labeldrop\n      - job_name: \"self-observability-core-metrics\"\n
      \       scrape_interval: 60s\n        static_configs:\n        - targets: [\"$HOST_LOOPBACK:8202\"]\n
      \       metric_relabel_configs:\n        - source_labels: [ __name__ ]\n          target_label:
      gke_component_name\n          replacement: \"addons/gke_metrics_agent\"\n        -
