- apiVersion: v1
  data:
    cilium-agent-hubble-metrics-collector-config-data: |
      # proto-file: cloud/kubernetes/metrics/components/collector/config/collector.proto
      # proto-message: Config

      scrape_target: {
        url: "http://localhost:9965/metrics"
        process_start_time_metric_name: "process_start_time_seconds"
        target_name: "cilium-agent-hubble"
        force_text_over_proto: true
      }
      export_target: {
        endpoint: "monitoring.googleapis.com:443"
      }
      metrics: {
        source_metric_name: "hubble_nld_downstream_total"
        export_metric_name: "kubernetes.io/internal/addons/advanceddatapath/nld_downstream_total"
        resource_metadata: {
          metric_schema: SCHEMA_K8S_CONTAINER
        }
        value_type: VALUE_TYPE_INT64
        metric_kind: METRIC_KIND_CUMULATIVE
        metric_labels: {
          source_name: "direction"
          type: METRIC_LABEL_STRING
          description: "Direction of the packet, possible value: [dnsQuery, dnsResponse]."
        }
        description: "Number of observed DNS queries from workloads to the Node Local DNS Cache."
        unit: "1"
      }
      metrics: {
        source_metric_name: "hubble_nld_upstream_total"
        export_metric_name: "kubernetes.io/internal/addons/advanceddatapath/nld_upstream_total"
        resource_metadata: {
          metric_schema: SCHEMA_K8S_CONTAINER
        }
        value_type: VALUE_TYPE_INT64
        metric_kind: METRIC_KIND_CUMULATIVE
        metric_labels: {
          source_name: "direction"
          type: METRIC_LABEL_STRING
          description: "Direction of the packet, possible value: [dnsQuery, dnsResponse]."
        }
        description: "Number of observed DNS queries from the Node Local DNS Cache to the upstream."
        unit: "1"
      }
      metrics: {
        source_metric_name: "hubble_nld_bypass_total"
        export_metric_name: "kubernetes.io/internal/addons/advanceddatapath/nld_bypass_total"
        resource_metadata: {
          metric_schema: SCHEMA_K8S_CONTAINER
        }
        value_type: VALUE_TYPE_INT64
        metric_kind: METRIC_KIND_CUMULATIVE
        metric_labels: {
          source_name: "direction"
          type: METRIC_LABEL_STRING
          description: "Direction of the packet, possible value: [dnsQuery, dnsResponse]."
        }
        description: "Number of observed DNS queries not going through the Node Local DNS Cache."
        unit: "1"
      }
      metrics: {
        source_metric_name: "hubble_sctp_flows_processed_total"
        export_metric_name: "kubernetes.io/internal/addons/advanceddatapath/sctp_flows_processed_total"
        resource_metadata: {
          metric_schema: SCHEMA_K8S_CONTAINER
        }
        value_type: VALUE_TYPE_INT64
        metric_kind: METRIC_KIND_CUMULATIVE
        metric_labels: {
          source_name: "verdict"
          type: METRIC_LABEL_STRING
          description: "Verdict of the SCTP flow, possible value: [VERDICT_UNKNOWN, FORWARDED, DROPPED, ERROR, AUDIT, REDIRECTED, TRACED, TRANSLATED]."
        }
        description: "Number of SCTP flows processed by Hubble."
        unit: "1"
      }
    cilium-agent-metrics-collector-config-data: |
      # proto-file: cloud/kubernetes/metrics/components/collector/config/collector.proto
      # proto-message: Config

      scrape_target: {
        url: "http://localhost:9990/metrics"
        process_start_time_metric_name: "cilium_process_start_time_seconds"
        target_name: "cilium-agent"
        force_text_over_proto: true
      }
      export_target: {
        endpoint: "monitoring.googleapis.com:443"
      }
      metrics: {
        source_metric_name: "cilium_agent_api_process_time_seconds"
        export_metric_name: "kubernetes.io/internal/addons/advanceddatapath/cilium_agent_api_process_time_seconds"
        resource_metadata: {
          metric_schema: SCHEMA_K8S_CONTAINER
        }
        value_type: VALUE_TYPE_DISTRIBUTION
        metric_kind: METRIC_KIND_CUMULATIVE
        metric_labels: {
          source_name: "method"
          type: METRIC_LABEL_STRING
          description: "HTTP method for API call."
        }
        metric_labels: {
          source_name: "path"
          type: METRIC_LABEL_STRING
          description: "API path."
        }
        metric_labels: {
          source_name: "return_code"
          type: METRIC_LABEL_STRING
          description: "Whether endpoint regeneration is successful or not, possible values: [success, fail]."
        }
        description: "Duration of processed API calls labeled by path, method and return code."
        unit: "seconds"
      }
      metrics: {
        source_metric_name: "cilium_endpoint_regenerations"
        export_metric_name: "kubernetes.io/internal/addons/advanceddatapath/cilium_endpoint_regenerations"
        resource_metadata: {
          metric_schema: SCHEMA_K8S_CONTAINER
        }
        value_type: VALUE_TYPE_INT64
        metric_kind: METRIC_KIND_CUMULATIVE
        metric_labels: {
          source_name: "outcome"
          type: METRIC_LABEL_STRING
          description: "Whether endpoint regeneration is successful or not, possible values: [success, fail]."
        }
        description: "Count of all endpoint regenerations that have completed, tagged by outcome"
        unit: "1"
      }
      metrics: {
        source_metric_name: "cilium_endpoint_regenerations_total"
        export_metric_name: "kubernetes.io/internal/addons/advanceddatapath/cilium_endpoint_regenerations_total"
        resource_metadata: {
          metric_schema: SCHEMA_K8S_CONTAINER
        }
        value_type: VALUE_TYPE_INT64
        metric_kind: METRIC_KIND_CUMULATIVE
        metric_labels: {
          source_name: "outcome"
          type: METRIC_LABEL_STRING
          description: "Whether endpoint regeneration is successful or not, possible values: [success, fail]."
        }
        description: "Count of all endpoint regenerations that have completed, tagged by outcome. This supersedes cilium_endpoint_regenerations."
        unit: "1"
      }
      metrics: {
        source_metric_name: "cilium_endpoint_regeneration_time_stats_seconds"
        export_metric_name: "kubernetes.io/internal/addons/advanceddatapath/cilium_endpoint_regeneration_time_stats_seconds"
        resource_metadata: {
          metric_schema: SCHEMA_K8S_CONTAINER
        }
        value_type: VALUE_TYPE_DISTRIBUTION
        metric_kind: METRIC_KIND_CUMULATIVE
        metric_labels: {
          source_name: "scope"
          type: METRIC_LABEL_STRING
