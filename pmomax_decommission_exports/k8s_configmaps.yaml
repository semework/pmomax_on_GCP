    config.yaml: |
      identities:
        - name: gcp
          gcp:
            encodedServiceAccountKey: $AGENT_ENCODED_KEY
      metrics:
        - name: M1
          type: int
          aggregation:
            bufferSeconds: 60
          endpoints:
            - name: disk
            - name: servicecontrol
      endpoints:
        - name: disk
          disk:
            reportDir: /var/lib/ubbagent/reports
            expireSeconds: 3600
