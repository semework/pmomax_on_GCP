- apiVersion: v1
  data:
    autoscaling-metrics-exporter-config: "receivers:\n  prometheus/resourcemetrics:\n
      \   use_start_time_metric: false\n    config:\n      scrape_configs:\n      -
      job_name: \"resources\"\n        scrape_interval: 5s\n        static_configs:\n
      \       - targets: [\"${env:KUBELET_HOST_URL}:10250\"]\n        scheme: \"https\"\n
      \       authorization:\n          type: \"Bearer\"\n          credentials_file:
      \"/var/run/secrets/kubernetes.io/serviceaccount/token\"\n        tls_config:\n
      \         ca_file: \"/var/run/secrets/kubernetes.io/serviceaccount/ca.crt\"\n
      \       metrics_path: \"metrics/resource\"\n        metric_relabel_configs:\n
      \       - source_labels: [ __name__ ]\n          regex: \"container_memory_working_set_bytes|container_cpu_usage_seconds_total\"\n
      \         action: keep\n  \n  prometheus/custommetrics:\n    use_start_time_metric:
      false\n    config:\n      global:\n        scrape_interval: \"5s\"\n      scrape_configs:\n
      \     - job_name: \"startup-job\"\n  \nexporters:\n  uas:\n    endpoint: us-central1-autoscaling.googleapis.com:443\n
      \   location: us-central1\n    cluster_name: pmomax-auto\n    project: \"839982691485\"\n
      \   is_multi_tenant_cluster: false\n    scrape_interval: 5s\n    gke_hostname:
      container.googleapis.com\n    uas_traffic_admission_class: METRICS_AGENT_ACTUATION\n
      \   enable_ubb_extension: true\n    network_id: 2876746639561657217\n  \n  uas/custommetrics:\n
      \   endpoint: us-central1-autoscaling.googleapis.com:443\n    location: us-central1\n
      \   cluster_name: pmomax-auto\n    project: \"839982691485\"\n    is_multi_tenant_cluster:
      false\n    scrape_interval: \"5s\"\n    gke_hostname: container.googleapis.com\n
      \   uas_traffic_admission_class: METRICS_AGENT_ACTUATION\n    enable_ubb_extension:
      true\n    network_id: 2876746639561657217\n  \nprocessors:\n    metric_to_resource:\n
      \     attributes_mapping:\n      - source_metric_attribute: namespace\n        target_resource_attribute:
      k8s.namespace.name\n      - source_metric_attribute: pod\n        target_resource_attribute:
      k8s.pod.name\n      - source_metric_attribute: container\n        target_resource_attribute:
      k8s.container.name\n    \n    k8sattributes:\n      auth_type: \"serviceAccount\"\n
      \     passthrough: false\n      filter:\n        # This filter restricts the
      metrics agent to query pods running on the speficified\n        # node only
      to reduce the resource requirements.\n        node_from_env_var: NODE_NAME\n
      \     extract:\n        metadata:\n        - k8s.pod.name\n        - k8s.namespace.name\n
      \       - k8s.container.name\n        - k8s.pod.ip\n        - k8s.pod.ips\n
      \       - container.ports\n        - container.resources.requests.cpu\n      pod_association:\n
      \     - sources:\n        - from: resource_attribute\n          name: k8s.pod.name\n
      \       - from: resource_attribute\n          name: k8s.namespace.name\n    \n
      \   \n    k8sattributes/custommetrics:\n      auth_type: \"serviceAccount\"\n
      \     passthrough: false\n      filter:\n        # This filter restricts the
      metrics agent to query pods running on the speficified\n        # node only
      to reduce the resource requirements.\n        node_from_env_var: NODE_NAME\n
      \     extract:\n        metadata:\n        - k8s.pod.name\n        - k8s.namespace.name\n
      \       - k8s.container.name\n        - k8s.pod.ip\n        - k8s.pod.ips\n
      \       - container.ports\n        - container.resources.requests.cpu\n      pod_association:\n
      \     - sources:\n        - from: resource_attribute\n          name: k8s.pod.name\n
      \       - from: resource_attribute\n          name: k8s.namespace.name\n    \nextensions:\n
      \ health_check:\n    endpoint: \"${env:HOST_LOOPBACK}:8201\"\nservice:\n  telemetry:\n
      \   metrics:\n      readers:\n        - pull:\n            exporter:\n              prometheus:\n
      \               host: ${env:HOST_LOOPBACK}\n                port: 8200\n  extensions:\n
      \ - health_check\n  pipelines:\n    metrics/resource_uas:\n      receivers:\n
      \     - prometheus/resourcemetrics\n      processors:\n      - metric_to_resource\n
      \     \n      - k8sattributes\n      \n      exporters:\n      - uas\n    \n
      \   metrics/custom_uas:\n      receivers:\n      - prometheus/custommetrics\n
      \     \n      processors:\n      - k8sattributes/custommetrics\n      \n      exporters:\n
      \     - uas/custommetrics\n    "
