<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Regulated AI Decision Lifecycle</title>
  <desc id="desc">Lifecycle from initiation to governance, execution, review, approval, audit, and improvement.</desc>
  <rect width="1280" height="720" fill="#f7f9fc"/>
  <text x="80" y="72" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#152238">Regulated AI Decision Lifecycle</text>
  <text x="80" y="108" font-family="Inter, Arial, sans-serif" font-size="18" fill="#526173">A governance-first lifecycle for AI-assisted decisions</text>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#486581"/></marker></defs>
  <g stroke="#486581" stroke-width="2" marker-end="url(#arrow)"><path d="M210 360 L295 360"/><path d="M425 360 L510 360"/><path d="M640 360 L725 360"/><path d="M855 360 L940 360"/><path d="M1070 360 L1135 360"/></g>
  <g font-family="Inter, Arial, sans-serif" fill="#172033">
    <rect x="70" y="315" width="140" height="90" rx="14" fill="#e8eef7" stroke="#b8c7da"/><text x="140" y="368" text-anchor="middle" font-size="17" font-weight="700">Initiation</text>
    <rect x="295" y="315" width="130" height="90" rx="14" fill="#fff4d7" stroke="#e7c772"/><text x="360" y="368" text-anchor="middle" font-size="17" font-weight="700">Governance</text>
    <rect x="510" y="315" width="130" height="90" rx="14" fill="#e7e8ff" stroke="#bbbdf2"/><text x="575" y="368" text-anchor="middle" font-size="17" font-weight="700">Execution</text>
    <rect x="725" y="315" width="130" height="90" rx="14" fill="#dff3ee" stroke="#a8d8cc"/><text x="790" y="368" text-anchor="middle" font-size="17" font-weight="700">Review</text>
    <rect x="940" y="315" width="130" height="90" rx="14" fill="#eef1f5" stroke="#cbd3df"/><text x="1005" y="368" text-anchor="middle" font-size="17" font-weight="700">Approval</text>
    <rect x="1135" y="315" width="110" height="90" rx="14" fill="#f1f7ff" stroke="#b7d1f2"/><text x="1190" y="368" text-anchor="middle" font-size="17" font-weight="700">Audit</text>
    <rect x="520" y="520" width="240" height="78" rx="14" fill="#ffe9e6" stroke="#efb3a8"/><text x="640" y="568" text-anchor="middle" font-size="18" font-weight="700">Improvement Loop</text>
  </g>
</svg>
