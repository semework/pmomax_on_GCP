<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Cognitive Trace Protocol</title>
  <desc id="desc">Trace flow from request through context, model/tool call, output, governance, review, and exportable audit.</desc>
  <rect width="1280" height="720" fill="#f7f9fc"/>
  <text x="80" y="72" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#152238">Cognitive Trace Protocol</text>
  <text x="80" y="108" font-family="Inter, Arial, sans-serif" font-size="18" fill="#526173">A reviewable record for AI-assisted work</text>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#486581"/></marker></defs>
  <g stroke="#486581" stroke-width="2" marker-end="url(#arrow)"><path d="M210 360 L295 360"/><path d="M425 360 L510 360"/><path d="M675 360 L760 360"/><path d="M890 360 L975 360"/><path d="M1105 360 L1160 360"/></g>
  <g font-family="Inter, Arial, sans-serif" fill="#172033">
    <rect x="80" y="310" width="130" height="100" rx="14" fill="#e8eef7" stroke="#b8c7da"/><text x="145" y="368" text-anchor="middle" font-size="18" font-weight="700">Request</text>
    <rect x="295" y="310" width="130" height="100" rx="14" fill="#fff4d7" stroke="#e7c772"/><text x="360" y="368" text-anchor="middle" font-size="18" font-weight="700">Context</text>
    <rect x="510" y="300" width="165" height="120" rx="14" fill="#e7e8ff" stroke="#bbbdf2"/><text x="592" y="348" text-anchor="middle" font-size="18" font-weight="700">Model /</text><text x="592" y="376" text-anchor="middle" font-size="18" font-weight="700">Tool Call</text>
    <rect x="760" y="310" width="130" height="100" rx="14" fill="#dff3ee" stroke="#a8d8cc"/><text x="825" y="368" text-anchor="middle" font-size="18" font-weight="700">Output</text>
    <rect x="975" y="310" width="130" height="100" rx="14" fill="#ffe9e6" stroke="#efb3a8"/><text x="1040" y="368" text-anchor="middle" font-size="18" font-weight="700">Review</text>
    <rect x="520" y="520" width="240" height="78" rx="14" fill="#f1f7ff" stroke="#b7d1f2"/><text x="640" y="568" text-anchor="middle" font-size="18" font-weight="700">Exportable Audit</text>
  </g>
</svg>
